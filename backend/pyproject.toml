[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edgewise"
version = "0.1.0"
description = "Value-betting assistant for top-5 European soccer leagues. Suggests bets; never places them without the owner's approval."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30,<2.2",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    "cryptography>=42",
    "qrcode>=7.4",
    "apscheduler>=3.10,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx2>=2.10",  # Starlette's test client
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
edgewise = "edgewise.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["edgewise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL database (set TEST_DATABASE_URL)",
]
filterwarnings = [
    # SQLite (used only in fast tests) stores Decimal as float; PostgreSQL is exact.
    "ignore:Dialect sqlite\\+pysqlite does \\*not\\* support Decimal objects natively:sqlalchemy.exc.SAWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "DTZ"]
ignore = [
    "S101",   # assert is fine in tests and for internal invariants
    "RUF001", # ambiguous unicode in strings: we use the minus sign and ¼ in owner-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["edgewise"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "DTZ001"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["edgewise"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "qrcode.*"]
ignore_missing_imports = true
