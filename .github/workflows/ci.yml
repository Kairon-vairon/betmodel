name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: edgewise
          POSTGRES_PASSWORD: edgewise
          POSTGRES_DB: edgewise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edgewise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://edgewise:edgewise@localhost:5432/edgewise_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Tests (including PostgreSQL integration tests)
        run: pytest

  web:
    name: Web app (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images and compose file
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t edgewise-backend:ci backend
      - run: docker build -t edgewise-web:ci web
      - name: Laptop setup works with no settings file
        run: docker compose config --quiet
      - name: Server setups are valid
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci/; s/^DOMAIN=.*/DOMAIN=example.com/' .env
          infra/stack live config --quiet
          cp .env .env.lab
          sed -i 's/^APP_ENV=.*/APP_ENV=lab/' .env.lab
          infra/stack lab config --quiet

  high-risk:
    name: High-risk change check (CLAUDE.md rule 4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Flag changes to stake sizing, safety limits and settlement money
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD | grep -E -f .github/high-risk-paths.txt || true)
          if [ -n "$changed" ]; then
            {
              echo "## High-risk changes"
              echo "These files affect stake sizing, safety limits or settlement money."
              echo "List them on their own under **High-risk changes** in the release notes."
              echo
              echo "$changed" | sed 's/^/- /'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=High-risk change::Stake sizing, safety limits or settlement code changed. Call it out separately in the release notes."
          else
            echo "No high-risk files changed." >> "$GITHUB_STEP_SUMMARY"
          fi
