# Edgewise services.
#
# On your own computer (docs/LAPTOP.md), in this folder:
#   docker compose up -d --build        then open http://localhost:8080
#   (compose.override.yaml is added automatically: it holds the laptop settings)
#
# On a server (docs/SETUP.md), always use the wrapper, which picks the env file, the
# project, public HTTPS or the lab settings, and checks the required values:
#   infra/stack live up -d --build
#   infra/stack lab up -d --build

name: edgewise

x-backend: &backend
  image: edgewise-backend:${EDGEWISE_VERSION:-local}
  restart: unless-stopped
  env_file:
    - path: ${EDGEWISE_ENV_FILE:-.env}
      required: false  # a laptop needs no settings file; infra/stack checks servers have one
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-edgewise}:${POSTGRES_PASSWORD:-edgewise}@db:5432/${POSTGRES_DB:-edgewise}
    # Used when APP_SECRET_KEY isn't set: a random key is created here on first start.
    APP_SECRET_KEY_FILE: /var/lib/edgewise/app_secret_key
  volumes:
    - app-secrets:/var/lib/edgewise

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edgewise}
      # The database is only reachable by the other Edgewise containers. Servers must
      # still set their own password (infra/stack refuses to start without one).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edgewise}
      POSTGRES_DB: ${POSTGRES_DB:-edgewise}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *backend
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    command: ["edgewise", "worker"]
    depends_on:
      api:
        condition: service_healthy  # the api applies database migrations first

  web:
    image: edgewise-web:${EDGEWISE_VERSION:-local}
    build: ./web
    restart: unless-stopped
    depends_on:
      - api

  # Public HTTPS (servers only: infra/stack live adds --profile public). Gets a
  # certificate for DOMAIN from Let's Encrypt automatically.
  caddy:
    image: caddy:2-alpine
    profiles: ["public"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}  # checked by infra/stack
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  db-data:
  app-secrets:
  caddy-data:
  caddy-config:
